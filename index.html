<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Gym HUD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    color: #00ff00;
    font-family: Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
  }

  #app {
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  @media (orientation: portrait) {
    #app { flex-direction: column; }
    .panel { width: 100%; height: 50%; }
    #divider { width: 100%; height: 2px; }
  }

  @media (orientation: landscape) {
    #app { flex-direction: row; }
    .panel { width: 50%; height: 100%; }
    #divider { width: 2px; height: 100%; }
  }

  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vmin;
  }

  #divider {
    background: #004400;
    flex-shrink: 0;
  }

  /* ── CLOCK PANEL ── */
  #time-hhmm {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(64px, 19vmin, 200px);
    color: #00ff00;
    line-height: 1;
    width: 100%;
    text-align: center;
    letter-spacing: 0.02em;
  }

  #time-ss {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(64px, 19vmin, 200px);
    color: #00ff00;
    line-height: 1;
    width: 100%;
    text-align: center;
    letter-spacing: 0.02em;
    margin-top: 0.5vmin;
  }

  #date-display {
    font-family: Arial, sans-serif;
    font-size: clamp(16px, 4vmin, 48px);
    color: #00cc00;
    letter-spacing: 0.08em;
    margin-top: 2vmin;
    text-align: center;
  }

  /* ── HR PANEL ── */
  #hr-bpm {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(72px, 22vmin, 220px);
    color: #00ff00;
    line-height: 1;
    transition: color 0.2s;
    text-align: center;
  }

  #hr-bpm.pulse { color: #afffaf; }

  #hr-label {
    font-family: Arial, sans-serif;
    font-size: clamp(14px, 3.5vmin, 40px);
    color: #009900;
    letter-spacing: 0.2em;
    margin-top: 0.5vmin;
  }

  #hr-stats {
    display: flex;
    gap: 6vmin;
    margin-top: 2vmin;
    color: #00bb00;
    letter-spacing: 0.1em;
  }

  #hr-stats span {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4em;
  }

  #hr-stats .stat-label {
    font-family: Arial, sans-serif;
    font-size: clamp(14px, 3.5vmin, 38px);
    color: #009900;
    letter-spacing: 0.2em;
  }

  #hr-stats .stat-val {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 5.5vmin, 60px);
    color: #00cc00;
  }

  /* ── CONNECT BUTTON ── */
  #connect-btn {
    margin-top: 2.5vmin;
    padding: 1.2vmin 3vmin;
    background: #001a00;
    color: #00ff00;
    border: 1px solid #00aa00;
    font-family: Arial, sans-serif;
    font-size: clamp(12px, 2.8vmin, 28px);
    letter-spacing: 0.12em;
    cursor: pointer;
    border-radius: 4px;
    touch-action: manipulation;
  }

  #connect-btn:active { background: #003300; }

  #hr-status {
    font-family: Arial, sans-serif;
    font-size: clamp(10px, 2.2vmin, 22px);
    color: #006600;
    letter-spacing: 0.08em;
    margin-top: 0.8vmin;
    min-height: 1.4em;
    text-align: center;
  }

  #wakelock-dot {
    position: fixed;
    top: 6px; right: 8px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #003300;
  }
  #wakelock-dot.active { background: #005500; }
</style>
</head>
<body>

<div id="app">

  <div class="panel" id="clock-panel">
    <div id="time-hhmm">00:00</div>
    <div id="time-ss">00</div>
    <div id="date-display">---</div>
  </div>

  <div id="divider"></div>

  <div class="panel" id="hr-panel">
    <div id="hr-bpm">--</div>
    <div id="hr-label">BPM</div>
    <div id="hr-stats">
      <span>
        <span class="stat-label">AVG</span>
        <span class="stat-val" id="hr-avg">--</span>
      </span>
      <span>
        <span class="stat-label">MAX</span>
        <span class="stat-val" id="hr-max">--</span>
      </span>
    </div>
    <button id="connect-btn" onclick="connectHR()">[ CONNECT STRAP ]</button>
    <div id="hr-status">tap to pair via bluetooth</div>
  </div>

</div>

<div id="wakelock-dot"></div>

<script>
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function pad2(n) { return String(n).padStart(2,'0'); }

function updateClock() {
  const now = new Date();
  document.getElementById('time-hhmm').textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  document.getElementById('time-ss').textContent   = pad2(now.getSeconds());
  document.getElementById('date-display').textContent =
    `${DAYS[now.getDay()]} ${pad2(now.getDate())} ${MONTHS[now.getMonth()]}`;
}

setInterval(updateClock, 1000);
updateClock();

let wakeLock = null;
const dot = document.getElementById('wakelock-dot');

async function requestWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    dot.classList.add('active');
    wakeLock.addEventListener('release', () => dot.classList.remove('active'));
  } catch(e) {
    console.warn('Wake lock:', e);
  }
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') await requestWakeLock();
});

requestWakeLock();

let hrReadings = [], hrMax = 0;

function updateHRDisplay(bpm) {
  const el = document.getElementById('hr-bpm');
  el.textContent = bpm;
  el.classList.add('pulse');
  setTimeout(() => el.classList.remove('pulse'), 200);

  hrReadings.push(bpm);
  if (bpm > hrMax) hrMax = bpm;
  const avg = Math.round(hrReadings.reduce((a,b) => a+b, 0) / hrReadings.length);
  document.getElementById('hr-avg').textContent = avg;
  document.getElementById('hr-max').textContent = hrMax;
}

function parseHR(value) {
  const flags = value.getUint8(0);
  return (flags & 0x01) ? value.getUint16(1, true) : value.getUint8(1);
}

async function connectHR() {
  const btn    = document.getElementById('connect-btn');
  const status = document.getElementById('hr-status');

  if (!navigator.bluetooth) {
    status.textContent = 'bluetooth not available in this browser';
    return;
  }

  try {
    status.textContent = 'scanning...';
    btn.textContent    = '[ SCANNING... ]';

    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: ['heart_rate'] }],
      optionalServices: ['heart_rate']
    });

    status.textContent = `connecting to ${device.name || 'device'}...`;

    device.addEventListener('gattserverdisconnected', () => {
      status.textContent = 'disconnected — tap to reconnect';
      btn.textContent    = '[ RECONNECT ]';
      btn.style.display  = 'block';
      document.getElementById('hr-bpm').textContent = '--';
    });

    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService('heart_rate');
    const char    = await service.getCharacteristic('heart_rate_measurement');

    await char.startNotifications();
    char.addEventListener('characteristicvaluechanged', (e) => {
      updateHRDisplay(parseHR(e.target.value));
    });

    status.textContent = `● live — ${device.name || 'strap'}`;
    btn.style.display  = 'none';

  } catch(e) {
    status.textContent = e.name === 'NotFoundError' ? 'no device selected' : `error: ${e.message}`;
    btn.textContent    = '[ CONNECT STRAP ]';
  }
}

document.addEventListener('touchstart', () => {}, { passive: true });
</script>
</body>
</html>
