<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gym HUD</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
body {
  margin: 0;
  background: #000;
  color: #00FF00;
  font-family: Arial, sans-serif;
}

.container {
  display: flex;
  width: 100vw;
  height: 100vh;
  flex-direction: column;
}

@media (orientation: landscape) {
  .container { flex-direction: row; }
}

.half {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transform: translateY(-8%);
}

#time, #seconds {
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 13vw;
  line-height: 0.9;
  text-align: center;
}

#date {
  font-size: 3.5vw;
  margin-top: 10px;
}

#hr {
  font-family: "Arial Black", Arial, sans-serif;
  font-size: 22vw;
}

#stats {
  font-size: 4.5vw;
  margin-top: 10px;
}
</style>
</head>

<body>
<div class="container">
  <div class="half">
    <div id="time"></div>
    <div id="seconds"></div>
    <div id="date"></div>
  </div>

  <div class="half">
    <div id="hr">--</div>
    <div id="stats">AVG -- | MAX --</div>
  </div>
</div>

<script>
// CLOCK
function updateClock() {
  const now = new Date();

  const hhmm = now.toLocaleTimeString('en-GB', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });

  const ss = now.toLocaleTimeString('en-GB', {
    second: '2-digit'
  });

  const date = now.toLocaleDateString('en-GB', {
    weekday: 'short',
    day: '2-digit',
    month: 'short'
  });

  document.getElementById("time").textContent = hhmm;
  document.getElementById("seconds").textContent = ss;
  document.getElementById("date").textContent = date;
}

setInterval(updateClock, 1000);
updateClock();

// HEART RATE
let hrValues = [];

async function connectHR() {
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: ['heart_rate'] }]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService('heart_rate');
    const char = await service.getCharacteristic('heart_rate_measurement');

    char.startNotifications();
    char.addEventListener('characteristicvaluechanged', e => {
      const val = e.target.value;
      const hr = val.getUint8(1);

      hrValues.push(hr);

      const avg = Math.round(hrValues.reduce((a,b)=>a+b,0)/hrValues.length);
      const max = Math.max(...hrValues);

      document.getElementById("hr").textContent = hr;
      document.getElementById("stats").textContent = `AVG ${avg} | MAX ${max}`;
    });

  } catch (err) {
    alert("HR failed: " + err);
  }
}

document.body.addEventListener("click", connectHR, { once: true });

// WAKE LOCK
let wakeLock = null;

async function keepAwake() {
  try {
    wakeLock = await navigator.wakeLock.request('screen');
  } catch {}
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});

keepAwake();

// SERVICE WORKER (offline + install)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
