<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Gym HUD</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:100%; height:100%;
    background:#000;
    color:#00ff00;
    font-family:Arial, sans-serif;
    overflow:hidden;
    touch-action:none;
  }

  #app {
    display:flex;
    width:100vw;
    height:100vh;
  }

  @media (orientation: portrait) {
    #app { flex-direction: column; }
    .panel { width:100%; height:50%; }
  }

  @media (orientation: landscape) {
    #app { flex-direction: row; }
    .panel { width:50%; height:100%; }
  }

  .panel {
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform: translateY(-5%);
  }

  #time {
    font-family:"Arial Black", Arial;
    font-size:14vw;
    text-align:center;
  }

  #seconds {
    font-family:"Arial Black", Arial;
    font-size:14vw;
    text-align:center;
  }

  #date {
    font-size:4vw;
    margin-top:10px;
  }

  #hr {
    font-family:"Arial Black", Arial;
    font-size:22vw;
  }

  #stats {
    font-size:4vw;
    margin-top:10px;
  }
</style>
</head>

<body>

<div id="app">
  <div class="panel">
    <div id="time">00:00</div>
    <div id="seconds">00</div>
    <div id="date">---</div>
  </div>

  <div class="panel">
    <div id="hr">--</div>
    <div id="stats">AVG -- | MAX --</div>
  </div>
</div>

<script>
// CLOCK
function updateClock(){
  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});

  document.getElementById("seconds").textContent =
    String(now.getSeconds()).padStart(2,'0');

  document.getElementById("date").textContent =
    now.toDateString().slice(0,10);
}
setInterval(updateClock,1000);
updateClock();

// HR (unchanged logic minimal)
let hrValues=[];

async function connectHR(){
  try{
    const device = await navigator.bluetooth.requestDevice({
      filters:[{services:['heart_rate']}]
    });

    const server = await device.gatt.connect();
    const service = await server.getPrimaryService('heart_rate');
    const char = await service.getCharacteristic('heart_rate_measurement');

    char.startNotifications();
    char.addEventListener('characteristicvaluechanged',e=>{
      const v=e.target.value;
      const hr=v.getUint8(1);

      hrValues.push(hr);

      const avg=Math.round(hrValues.reduce((a,b)=>a+b,0)/hrValues.length);
      const max=Math.max(...hrValues);

      document.getElementById("hr").textContent=hr;
      document.getElementById("stats").textContent=`AVG ${avg} | MAX ${max}`;
    });

  }catch(e){
    alert(e);
  }
}

document.body.addEventListener("click",connectHR,{once:true});

// SERVICE WORKER (critical fix)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js');
}
</script>

</body>
</html>
